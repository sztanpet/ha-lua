<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ha-lua</title>
<style>
:root {
  color-scheme: light dark;
  --bg: oklch(97% 0.004 260);
  --fg: oklch(28% 0.012 260);
  --muted: oklch(from var(--fg) calc(l + 0.28) c h);
  --line: oklch(from var(--bg) calc(l - 0.10) c h);
  --raised: oklch(from var(--bg) calc(l + 0.03) c h);
  --accent: oklch(58% 0.15 255);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(21% 0.010 260);
    --fg: oklch(92% 0.006 260);
    --muted: oklch(from var(--fg) calc(l - 0.30) c h);
    --line: oklch(from var(--bg) calc(l + 0.10) c h);
    --raised: oklch(from var(--bg) calc(l + 0.04) c h);
    --accent: oklch(72% 0.13 255);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
nav {
  display: flex;
  align-items: stretch;
  gap: 2px;
  padding: 0 8px;
  background: var(--raised);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: thin;
}
nav a {
  flex: none;
  padding: 11px 16px;
  color: var(--muted);
  text-decoration: none;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
nav a:hover { color: var(--fg); background: oklch(from var(--raised) calc(l + 0.04) c h); }
nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
nav .err { padding: 11px 16px; color: var(--muted); }
/* The HA companion app's WebView would not touch-scroll the framed page until
   it had been tapped once, so the framed page must never be the scroller:
   shell.js grows the iframe to its content height and #view scrolls instead. */
#view { flex: 1; min-height: 0; overflow: auto; }
iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
</style>
</head>
<body>
<nav id="tabs"></nav>
<div id="view"><iframe id="page" title="script page"></iframe></div>
<script src="ui/shell.js"></script>
</body>
</html>
