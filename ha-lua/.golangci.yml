version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - noctx
    - exhaustive
  settings:
    errcheck:
      # Deferred cleanup where the error is unconditionally uninteresting:
      # Rollback after Commit is a no-op error, Rows.Close errors surface
      # via Rows.Err, double-Close of DB handles is harmless, a pinned
      # sql.Conn only goes back to the pool, and websocket CloseNow is
      # documented best-effort.
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - (*github.com/coder/websocket.Conn).CloseNow
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - (*os.Root).Close
        - (io.Closer).Close
        # SMTP cleanup: Client.Close after Quit errors by design, and a
        # close error on an already-failed connection changes nothing.
        - (*net/smtp.Client).Close
        - (net.Conn).Close
        - (net.Listener).Close
        # *net.UDPConn and friends: their Close is promoted from net.conn
        - (*net.conn).Close
    misspell:
      # Eclipse Mosquitto is the broker's actual name; misspell's dictionary
      # only knows the insect.
      ignore-rules:
        - mosquitto
    staticcheck:
      checks: ["all"]

formatters:
  enable:
    - goimports

issues:
  max-same-issues: 0
