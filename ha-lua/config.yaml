name: "HA Lua"
description: "Lua scripting engine for Home Assistant"
version: "4.7.0"
slug: "ha-lua"
init: false
# Pull the prebuilt per-arch image from GHCR (pushed by .github/release.yml)
# instead of building on-device. {arch} is substituted by the Supervisor; the
# pulled tag matches version: above. Keep this in sync with the image name in
# the release workflow (ghcr.io/<owner>/<arch>-<slug>).
image: "ghcr.io/sztanpet/{arch}-ha-lua"
arch:
  - aarch64
  - amd64
homeassistant_api: true        # provides $SUPERVISOR_TOKEN + ws://supervisor/core/websocket
# "want", not "need": scripts may talk to an external broker configured in the
# options below, or to none at all, and the add-on must still install on a
# system with no Mosquitto add-on. When the service IS provided, an empty
# mqtt.broker option is filled in from it automatically.
services:
  - mqtt:want
startup: services
boot: auto
ingress: true                  # authenticated sidebar panel
ingress_port: 8099             # internal port the Supervisor proxies; MUST match config.IngressPort default
panel_icon: mdi:language-lua
panel_title: "HA Lua"
ports:
  "8100/tcp": 8100             # stable LAN port for dashboard Webpage cards (unauthenticated, LAN-trust)
ports_description:
  "8100/tcp": "Script-driven UI (e.g. thermostat). Unauthenticated — keep on the LAN only."
map:
  # Mount the Home Assistant config directory (the one the File Editor and
  # Samba expose as "config") at /config inside the container, so scripts
  # live in the user's main config tree under ha-lua/ — the same place the
  # ESPHome add-on keeps its YAML. The modern homeassistant_config type
  # defaults to /homeassistant; the path override pins it back to /config.
  # (addon_config would instead bind a private /addon_configs/<slug> folder
  # that users cannot easily find or edit.)
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  log_level: "info"
  timezone: ""
  http_port: 8100
  mqtt:
    broker: ""
    username: ""
    password: ""
    client_id: ""
  state_history:
    retention_days: 2
    purge_interval: "1h"
    keep: []
  debug:
    pprof_addr: ""
schema:
  log_level: "str"
  timezone: "str?"
  http_port: "int"
  # Direct MQTT, for devices Home Assistant cannot surface as entities (a
  # Zigbee2MQTT button published as a device trigger is the motivating case).
  # Leave broker empty to use the Mosquitto add-on's own credentials, or point
  # it at any broker: "core-mosquitto", "192.168.1.5:1883", "ssl://host:8883".
  mqtt:
    broker: "str?"
    username: "str?"
    password: "password?"
    client_id: "str?"
  state_history:
    retention_days: "int"
    purge_interval: "str"
    # Per-glob retention overrides, e.g. keep the door sensors for a month so
    # ha.duration_in_state has a month to answer over. First match wins.
    keep:
      - pattern: "str"
        days: "int"
  debug:
    pprof_addr: "str?"
