<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batteries</title>
<style>
  /* Neutrals share one hue (262); the ramp is pure lightness steps. --ok /
     --warn / --bad are the standalone palette anchors; every tint, track and
     border below is derived from one of them with oklch(from …) so a change to
     an anchor carries through the whole page. */
  :root { color-scheme: light dark;
          --bg:oklch(0.970 0.003 262); --card:oklch(1 0 0);
          --ink:oklch(0.234 0.007 262); --muted:oklch(0.573 0.008 262);
          --line:oklch(0.921 0.005 262); --surface:oklch(0.958 0.003 262);
          --ok:oklch(0.646 0.146 148); --warn:oklch(0.705 0.152 71);
          --bad:oklch(0.586 0.203 27);
          --track:oklch(from var(--ink) 0.905 0.006 h);
          --ok-soft:oklch(from var(--ok) 0.945 0.045 h);
          --warn-soft:oklch(from var(--warn) 0.945 0.055 h);
          --bad-soft:oklch(from var(--bad) 0.945 0.045 h); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:oklch(0.204 0.007 262); --card:oklch(0.259 0.010 262);
            --ink:oklch(0.928 0.003 262); --muted:oklch(0.695 0.009 262);
            --line:oklch(0.336 0.011 262); --surface:oklch(0.305 0.012 262);
            --ok:oklch(0.723 0.152 148); --warn:oklch(0.782 0.152 76);
            --bad:oklch(0.674 0.191 25);
            --track:oklch(from var(--ink) 0.360 0.012 h);
            --ok-soft:oklch(from var(--ok) 0.310 0.050 h);
            --warn-soft:oklch(from var(--warn) 0.320 0.055 h);
            --bad-soft:oklch(from var(--bad) 0.310 0.055 h); }
  }
  * { box-sizing: border-box; }
  body { margin:0 auto; background:var(--bg); color:var(--ink); padding:12px;
         max-width:820px;
         font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  h1 { font-size:1.3rem; margin:8px 4px 4px; }
  .topbar { display:flex; align-items:baseline; justify-content:space-between;
            gap:8px; flex-wrap:wrap; margin:0 4px 14px; }
  .stamp { color:var(--muted); font-size:.85rem; }
  select { padding:6px 8px; border:1px solid var(--line); border-radius:8px;
           background:var(--surface); color:var(--ink); cursor:pointer; }
  .head, .row { display:grid; gap:6px 12px; align-items:center;
                grid-template-columns:minmax(0,1fr) 150px 110px 150px 72px; }
  .head { padding:0 14px 6px; color:var(--muted); font-size:.78rem;
          font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .row { background:var(--card); border-radius:12px; padding:12px 14px;
         margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.08);
         cursor:pointer; }
  .name { font-weight:600; min-width:0; overflow-wrap:anywhere; }
  .eid { display:block; color:var(--muted); font-size:.78rem; font-weight:400;
         overflow-wrap:anywhere; }
  .level { display:flex; align-items:center; gap:8px; }
  .pct { font-variant-numeric:tabular-nums; font-weight:600; width:3.2em;
         text-align:right; }
  .bar { flex:1; height:8px; border-radius:999px; background:var(--track);
         overflow:hidden; }
  .bar span { display:block; height:100%; border-radius:999px; background:var(--ok); }
  .warn .bar span { background:var(--warn); }
  .bad .bar span  { background:var(--bad); }
  .warn .pct { color:var(--warn); }
  .bad .pct  { color:var(--bad); }
  .drain, .ago { color:var(--muted); font-variant-numeric:tabular-nums;
                 font-size:.9rem; }
  .eta { font-variant-numeric:tabular-nums; }
  .eta .when { display:block; color:var(--muted); font-size:.78rem; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px;
          font-size:.85rem; font-weight:600; background:var(--ok-soft); color:var(--ok); }
  .pill.warn { background:var(--warn-soft); color:var(--warn); }
  .pill.bad  { background:var(--bad-soft);  color:var(--bad); }
  .pill.unknown { background:var(--surface); color:var(--muted); font-weight:400; }
  .act { display:flex; justify-content:flex-end; }
  .act button { padding:4px 10px; border:1px solid var(--line); border-radius:8px;
                background:var(--surface); color:var(--muted); font:inherit;
                font-size:.85rem; cursor:pointer; }
  .act button:hover { color:var(--ink); }
  .act button[disabled] { opacity:.5; cursor:default; }
  .row.ignored { opacity:.55; }
  .row.ignored .bar span { background:var(--muted); }
  .row.ignored .pct { color:var(--muted); }
  .empty, .err { padding:16px; color:var(--muted); text-align:center; }
  .err { color:var(--bad); }
  /* The inspector. Its own block below the row rather than inside it, so the
     row grid stays a row grid. */
  .row.open { margin-bottom:0; border-bottom-left-radius:0;
              border-bottom-right-radius:0; }
  .detail { background:var(--surface); border:1px solid var(--line);
            border-top:none; border-radius:0 0 12px 12px; padding:12px 14px;
            margin-bottom:8px; font-size:.86rem; }
  .verdict { margin:0 0 10px; }
  .detail dl { display:grid; grid-template-columns:max-content minmax(0,1fr);
               gap:3px 12px; margin:0 0 12px; }
  .detail dt { color:var(--muted); }
  .detail dd { margin:0; font-variant-numeric:tabular-nums;
               overflow-wrap:anywhere; }
  .trail { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
  .trail h3 { font-size:.72rem; text-transform:uppercase; letter-spacing:.04em;
              color:var(--muted); font-weight:600; margin:0; }
  .trail ul { list-style:none; margin:0; padding:0; }
  .trail li { padding:4px 0; border-top:1px solid var(--line);
              font-variant-numeric:tabular-nums; }
  .trail .at { color:var(--muted); margin-right:6px; }
  .trail .why { font-weight:600; }
  .trail .why.reset { color:var(--bad); }
  .trail .note { display:block; color:var(--muted); }
  .detail .err { padding:0; text-align:left; }
  @media (max-width:680px) { .trail { grid-template-columns:1fr; } }
  /* One column per line below the table breakpoint; each cell grows a label so
     the numbers stay readable without a header row to align against. */
  @media (max-width:680px) {
    .head { display:none; }
    .row { grid-template-columns:1fr; gap:8px; }
    .cell::before { content:attr(data-label) ": "; color:var(--muted);
                    font-size:.8rem; text-transform:uppercase;
                    letter-spacing:.04em; margin-right:6px; }
    .cell.name::before, .cell.act::before { content:none; }
    .act { justify-content:flex-start; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>Batteries</h1>
    <div class="stamp" id="stamp"></div>
  </div>
  <label>Sort
    <select id="sort">
      <option value="urgency">Dies first</option>
      <option value="level">Lowest level</option>
      <option value="changed">Longest unchanged</option>
      <option value="name">Name</option>
    </select>
  </label>
</div>
<div class="head">
  <span>Device</span><span>Level</span><span>Last change</span><span>Empty in</span><span></span>
</div>
<div id="app"><div class="empty">Loading…</div></div>

<script>
"use strict";

const LOW_LEVEL = 25;      // amber below this
const CRITICAL_LEVEL = 10; // red below this
const SOON_DAYS = 7;       // amber ETA
const URGENT_DAYS = 2;     // red ETA
const POLL_MS = 60000;

let lastState = null;
let openEntity = null;  // entity id whose inspector is expanded
let openDetail = null;  // its last /api/detail payload

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const key in attrs) {
    const val = attrs[key];
    if (val == null || val === false) continue;
    if (key === "class") el.className = val;
    else if (key.startsWith("on")) el[key.toLowerCase()] = val;
    else el.setAttribute(key, val);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    el.append(child.nodeType ? child : document.createTextNode(child));
  }
  return el;
}

// Coarse duration, one unit only — "6 d" is the answer to "when do I need to
// buy batteries"; "6 d 4 h 12 m" is noise.
function fmtDuration(seconds) {
  const abs = Math.max(0, Math.round(seconds));
  if (abs < 90) return "moments";
  if (abs < 5400) return Math.round(abs / 60) + " min";
  if (abs < 172800) return Math.round(abs / 3600) + " h";
  if (abs < 5184000) return Math.round(abs / 86400) + " d";
  return Math.round(abs / 2592000) + " mo";
}

const dateFmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium" });
const stampFmt = new Intl.DateTimeFormat(undefined, { timeStyle: "medium" });

function levelClass(level) {
  if (level <= CRITICAL_LEVEL) return "bad";
  if (level <= LOW_LEVEL) return "warn";
  return "";
}

function etaClass(seconds) {
  if (seconds <= URGENT_DAYS * 86400) return "bad";
  if (seconds <= SOON_DAYS * 86400) return "warn";
  return "";
}

function etaCell(battery) {
  if (battery.ignored) {
    return h("div", { class: "cell eta", "data-label": "Empty in" },
      h("span", { class: "pill unknown",
        title: "ignored: no samples are kept and no forecast is made" }, "ignored"));
  }
  if (battery.eta_seconds != null) {
    const when = battery.empty_at ? dateFmt.format(battery.empty_at * 1000) : null;
    // A rate off one step is wide open; it tightens as the battery sits.
    const rough = (battery.steps || 0) < 2;
    return h("div", { class: "cell eta", "data-label": "Empty in" },
      h("span", { class: "pill " + etaClass(battery.eta_seconds),
                  title: rough
                    ? "one level step observed so far — rough, and it settles "
                      + "as more steps land"
                    : battery.steps + " level steps observed" },
        (rough ? "~" : "") + fmtDuration(battery.eta_seconds)),
      when && h("span", { class: "when" }, when));
  }
  if (battery.eta_at_least != null) {
    // Uncoloured on purpose: an amber bound would read as a prediction.
    return h("div", { class: "cell eta", "data-label": "Empty in" },
      h("span", { class: "pill unknown",
        title: "the level has not moved once since tracking started, so there "
             + "is no drain rate — this is a floor from how long it has held "
             + battery.level + "%, not a forecast" },
        "> " + fmtDuration(battery.eta_at_least)));
  }
  return h("div", { class: "cell eta", "data-label": "Empty in" },
    h("span", { class: "pill unknown",
      title: "the level has not moved and has not held long enough to bound — "
           + "give it a day" }, "measuring"));
}

const atFmt = new Intl.DateTimeFormat(undefined, { dateStyle: "short", timeStyle: "short" });

function fmtAt(unix) { return atFmt.format(unix * 1000); }
function fmtLevel(level) { return level == null ? "—" : level + "%"; }
function fmtSigned(delta) { return (delta > 0 ? "+" : "−") + Math.abs(delta); }

// The line worth reading first: which of the three answers this row got, and
// what decided it. When there is no forecast it names the guard that failed —
// a bare "measuring" is exactly what makes the page impossible to trust.
function verdict(detail) {
  const math = detail.math;
  if (math.tier === "eta") {
    if (math.remaining <= 0) {
      return "At or below the " + math.empty_level + "% replace line already.";
    }
    if (math.capped) {
      return "Held " + detail.level + "% for " + fmtDuration(math.dwell)
        + ", so whatever it drained at before (" + math.measured_per_day.toFixed(2)
        + " %/day), it is not draining faster than " + math.per_day.toFixed(2)
        + " %/day now.";
    }
    return "Median of " + math.pairs + " sample pairs across "
      + fmtDuration(math.span) + ": " + math.per_day.toFixed(2) + " %/day.";
  }
  if (math.tier === "floor") {
    return "No step observed yet — a floor from how long it has held "
      + detail.level + "%, not a forecast.";
  }
  if (!math.samples) return "No samples stored yet; the next scan writes the first.";
  if (math.span < math.min_span) {
    return "The window is only " + fmtDuration(math.span) + " — a rate needs "
      + fmtDuration(math.min_span) + ", and a wiped run starts it over.";
  }
  if (math.measured_per_day != null && math.measured_per_day <= 0) {
    return "Across " + math.pairs + " sample pairs the level is not trending "
      + "down, so there is nothing to extrapolate.";
  }
  return "No forecast and no floor.";
}

function field(label, value) {
  return [h("dt", null, label), h("dd", null, value)];
}

function seriesList(series) {
  if (!series.length) return h("p", { class: "note" }, "No samples yet.");
  const items = series.map((entry, index) => {
    const previous = index > 0 ? series[index - 1] : null;
    return h("li", null,
      h("span", { class: "at" }, fmtAt(entry.at)),
      fmtLevel(entry.level),
      previous && h("span", { class: "note" },
        fmtSigned(entry.level - previous.level) + " after "
        + fmtDuration(entry.at - previous.at)));
  });
  return h("ul", null, items.reverse());
}

const WHY = {
  first: "first sample", sample: "level stepped", reset: "run wiped",
  load: "script loaded", tier: "answer changed", drift: "forecast moved",
};

function eventNote(event) {
  const parts = [];
  if (event.why === "reset") {
    parts.push("rose to " + event.level + "% from a run low of " + event.low
      + "%, discarding " + event.wiped + " samples");
  } else if (event.from != null) {
    parts.push(event.from + "% → " + event.level + "%");
  }
  if (event.from_tier) parts.push("was " + event.from_tier);
  if (event.from_eta != null) parts.push("was " + fmtDuration(event.from_eta));
  if (event.drop != null && event.span != null) {
    parts.push(event.drop + " over " + fmtDuration(event.span));
  }
  if (event.trimmed) parts.push("oldest sample trimmed");
  parts.push(event.eta != null ? "→ " + fmtDuration(event.eta)
    : event.floor != null ? "→ floor " + fmtDuration(event.floor)
    : "→ no forecast");
  return parts.join(" · ");
}

function eventList(events) {
  if (!events.length) return h("p", { class: "note" }, "Nothing recorded yet.");
  const items = events.map(event => h("li", null,
    h("span", { class: "at" }, fmtAt(event.at)),
    h("span", { class: "why " + event.why }, WHY[event.why] || event.why),
    h("span", { class: "note" }, eventNote(event))));
  return h("ul", null, items.reverse());
}

function detailPanel(detail) {
  if (detail == null) return h("div", { class: "detail" }, "Loading…");
  if (detail.error) {
    return h("div", { class: "detail" }, h("div", { class: "err" }, detail.error));
  }
  const math = detail.math;
  const windowText = math.oldest_at
    ? fmtLevel(math.oldest_level) + " at " + fmtAt(math.oldest_at) + "  →  "
      + fmtLevel(detail.level) + " now, " + fmtDuration(math.span)
    : "—";
  const rate = math.per_day != null
    ? math.per_day.toFixed(2) + " %/day"
      + (math.capped
          ? " — bounded by the " + fmtDuration(math.dwell) + " at this level, "
            + "down from a measured " + math.measured_per_day.toFixed(2)
          : " across " + math.pairs + " sample pairs")
    : "—";
  const answer = math.eta_seconds != null
    ? fmtDuration(math.eta_seconds) + " (" + math.remaining + " points above "
      + math.empty_level + "%)"
    : math.eta_at_least != null ? "at least " + fmtDuration(math.eta_at_least)
    : "none";

  return h("div", { class: "detail" },
    h("p", { class: "verdict" }, verdict(detail)),
    h("dl", null,
      field("Window", windowText),
      field("Rate", rate),
      field("Empty in", answer),
      // The threshold that silently destroys a run, in the units it is judged
      // in: what the level has to reach for the samples to be thrown away.
      field("Wipes at", math.resets_at != null
        ? math.resets_at + "% (run low " + math.low + "% + " + math.recharge_rise + ")"
        : "—"),
      field("Samples", math.samples + " of " + math.max_samples
        + " · " + math.steps + " steps"),
      field("Last change", detail.changed_at ? fmtAt(detail.changed_at)
        + (detail.level_is_state ? "" : " (attribute only — no last_changed)")
        : "unknown")),
    h("div", { class: "trail" },
      h("div", null, h("h3", null, "Samples"), seriesList(detail.series)),
      h("div", null, h("h3", null, "Events"), eventList(detail.events))));
}

async function toggleDetail(entityID) {
  if (openEntity === entityID) {
    openEntity = null;
    openDetail = null;
    render(lastState);
    return;
  }
  openEntity = entityID;
  openDetail = null;
  render(lastState);
  await loadDetail(entityID);
}

async function loadDetail(entityID) {
  let payload;
  try {
    const resp = await fetch("./api/detail?entity_id=" + encodeURIComponent(entityID));
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    payload = await resp.json();
  } catch (err) {
    payload = { error: "Cannot read the detail: " + err.message };
  }
  if (openEntity !== entityID) return; // closed or switched while in flight
  openDetail = payload;
  render(lastState);
}

function row(battery) {
  const level = Number(battery.level);
  const drain = battery.drain_per_day != null
    ? battery.drain_per_day.toFixed(1) + " %/day"
    : "";
  const open = openEntity === battery.entity_id;
  return h("div", { class: "row " + (battery.ignored ? "ignored " : "")
                           + (open ? "open " : "") + levelClass(level),
                    title: "Show how this forecast was computed",
                    onclick: () => toggleDetail(battery.entity_id) },
    h("div", { class: "cell name" },
      battery.name,
      h("span", { class: "eid" }, battery.entity_id)),
    h("div", { class: "cell level", "data-label": "Level",
               title: drain && "draining " + drain },
      h("span", { class: "pct" }, level.toFixed(0) + "%"),
      h("span", { class: "bar" }, h("span", { style: "width:" + level + "%" }))),
    h("div", { class: "cell ago", "data-label": "Last change",
               title: battery.changed_at
                 ? new Date(battery.changed_at * 1000).toLocaleString() : null },
      battery.changed_ago != null ? fmtDuration(battery.changed_ago) + " ago" : "—"),
    etaCell(battery),
    h("div", { class: "cell act" },
      h("button", {
        title: battery.ignored
          ? "Track this battery again"
          : "Stop sampling this battery and sort it last",
        onclick: event => {
          event.stopPropagation(); // the row itself opens the inspector
          setIgnored(battery, !battery.ignored, event.currentTarget);
        }
      }, battery.ignored ? "Track" : "Ignore")));
}

async function setIgnored(battery, ignored, button) {
  button.disabled = true;
  try {
    const resp = await fetch("./api/ignore", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ entity_id: battery.entity_id, ignored: ignored })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    lastState = await resp.json();
    render(lastState);
  } catch (err) {
    button.disabled = false;
    button.textContent = "retry";
  }
}

// The daemon already sorts by urgency; the other orders are pure presentation,
// so they are applied here rather than round-tripping a preference.
function sorted(batteries) {
  const mode = document.getElementById("sort").value;
  const rows = batteries.slice();
  if (mode === "level") rows.sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
  else if (mode === "name") rows.sort((a, b) => a.name.localeCompare(b.name));
  else if (mode === "changed") {
    rows.sort((a, b) => (b.changed_ago ?? -1) - (a.changed_ago ?? -1)
                     || a.name.localeCompare(b.name));
  }
  rows.sort((a, b) => (a.ignored ? 1 : 0) - (b.ignored ? 1 : 0));
  return rows;
}

function render(state) {
  const app = document.getElementById("app");
  const batteries = Array.isArray(state.batteries) ? state.batteries : [];
  document.getElementById("stamp").textContent = state.generated_at
    ? batteries.length + " batteries · updated " + stampFmt.format(state.generated_at * 1000)
    : "";
  app.innerHTML = "";
  if (!batteries.length) {
    app.append(h("div", { class: "empty" },
      "No battery entities found. This page lists sensors with device_class "
      + "\"battery\" and entities carrying a battery_level attribute."));
    return;
  }
  sorted(batteries).forEach(battery => {
    app.append(row(battery));
    if (openEntity === battery.entity_id) app.append(detailPanel(openDetail));
  });
}

async function poll() {
  try {
    const resp = await fetch("./api/state");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    lastState = await resp.json();
    render(lastState);
    // The scan behind that poll may have moved the very thing being inspected.
    if (openEntity) await loadDetail(openEntity);
  } catch (err) {
    if (!lastState) {
      document.getElementById("app").innerHTML = "";
      document.getElementById("app").append(
        h("div", { class: "err" }, "Cannot reach the daemon: " + err.message));
    }
    // With a state already on screen a hiccup is ignored; the next poll retries.
  }
}

document.getElementById("sort").onchange = () => { if (lastState) render(lastState); };
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
