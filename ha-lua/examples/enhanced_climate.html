<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enhanced climates — ha-lua</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: oklch(0.55 0.18 25);
      /* danger hover/border derived from the accent, not hand-picked */
      --accent-hover: oklch(from var(--accent) calc(l - 0.08) c h);
      --line: color-mix(in oklch, currentColor 18%, transparent);
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0 auto;
      padding: 1.5rem;
      max-width: 40rem;
      line-height: 1.4;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0 0 .25rem;
    }

    p.intro {
      margin: 0 0 1.25rem;
      opacity: .75;
      font-size: .9rem;
    }

    ul.climates {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li.climate {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .75rem 1rem;
      border: 1px solid var(--line);
      border-radius: .6rem;
      margin-bottom: .6rem;
    }

    li.empty {
      opacity: .6;
      padding: 1rem;
      text-align: center;
    }

    .meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .name {
      font-weight: 600;
    }

    .sub {
      font-size: .82rem;
      opacity: .65;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button.remove {
      flex: none;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: .5rem;
      padding: .4rem .9rem;
      font: inherit;
      cursor: pointer;
    }

    button.remove:hover {
      background: var(--accent);
      color: white;
    }

    button.remove:disabled {
      opacity: .5;
      cursor: default;
    }

    /* The overshoot panel. Collapsed by default: this page's job is removal,
       and the learner is what you come looking for only when a room is wrong. */
    li.climate {
      flex-wrap: wrap;
      /* Without this a flex item refuses to shrink below its content, and the
         journal table pushes the row (and the Remove button) off-screen. */
      min-width: 0;
    }

    details.overshoot {
      flex: 1 0 100%;
      min-width: 0;
      margin-top: .5rem;
      font-size: .85rem;
    }

    details.overshoot summary {
      cursor: pointer;
      opacity: .75;
    }

    .learner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem;
      margin: .6rem 0;
    }

    /* The sentence takes its own line so the two buttons always sit together
       and neither is pushed off the edge on a phone. */
    .learner .state {
      flex: 1 1 100%;
    }

    .learner button {
      border: 1px solid var(--line);
      background: transparent;
      color: inherit;
      border-radius: .4rem;
      padding: .3rem .7rem;
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
    }

    .learner button:hover {
      border-color: currentColor;
    }

    .learner .observing {
      color: var(--accent);
    }

    /* The journal is wider than a phone. It scrolls on its own rather than
       widening the card and pushing Remove out of reach. */
    .journal-scroll {
      overflow-x: auto;
      margin-top: .4rem;
    }

    table.journal {
      width: 100%;
      border-collapse: collapse;
      font-size: .78rem;
      font-variant-numeric: tabular-nums;
    }

    table.journal th,
    table.journal td {
      text-align: right;
      padding: .25rem .4rem;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    table.journal th:first-child,
    table.journal td:first-child {
      text-align: left;
    }

    table.journal tr.discarded {
      /* Dimmed, not hidden: a run of discards is the failure this page exists
         to make visible. */
      opacity: .6;
    }

    table.journal td.err-hot {
      color: var(--accent);
    }

    .empty-journal {
      opacity: .6;
      padding: .4rem 0;
    }
  </style>
</head>

<body>
  <h1>Enhanced climates</h1>
  <p class="intro">
    Climate entities provisioned through the enhanced-climate card. Deleting a card from a dashboard does
    <strong>not</strong> remove its configuration — remove it here.
  </p>
  <ul id="list" class="climates"></ul>

  <script>
    const apiURL = (path) => "./api/" + path;

    async function load() {
      const response = await fetch(apiURL("list"));
      const data = await response.json();
      // An empty Lua table serialises as {}, not [], so guard with Array.isArray.
      render(Array.isArray(data.climates) ? data.climates : []);
    }

    function render(climates) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      if (climates.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No enhanced climates configured.";
        list.appendChild(empty);
        return;
      }
      for (const climate of climates) {
        const row = document.createElement("li");
        row.className = "climate";

        const meta = document.createElement("div");
        meta.className = "meta";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = climate.name || climate.climate_entity;
        const sub = document.createElement("span");
        sub.className = "sub";
        const windowCount = (climate.window_sensors || []).length;
        sub.textContent = climate.climate_entity + " · " + windowCount + " window sensor(s)";
        meta.appendChild(name);
        meta.appendChild(sub);

        const button = document.createElement("button");
        button.className = "remove";
        button.textContent = "Remove";
        button.onclick = () => remove(climate.climate_entity, button);

        row.appendChild(meta);
        row.appendChild(button);
        row.appendChild(overshootPanel(climate));
        list.appendChild(row);
      }
    }

    // The overshoot learner, per climate. This is the curl-free way to read a
    // week of episodes before deciding whether to trust the correction, and the
    // reset that recovers from a bad coefficient without sqlite3 or a restart.
    function overshootPanel(climate) {
      const overshoot = climate.overshoot || {};
      const samples = Number(overshoot.samples) || 0;
      const observing = overshoot.observe_only !== false;

      const details = document.createElement("details");
      details.className = "overshoot";
      const summary = document.createElement("summary");
      summary.textContent = "Overshoot correction — " +
        (observing ? "observing only" : "active") +
        (samples > 0 ? ", k " + round(overshoot.k, 3) + " over " + samples + " episode(s)"
          : ", nothing learned yet");
      details.appendChild(summary);

      const body = document.createElement("div");
      body.className = "learner";
      const state = document.createElement("span");
      state.className = observing ? "state observing" : "state";
      state.textContent = observing
        ? "Computing and recording the correction; the heating is untouched."
        : "Cutting warmups short by the learned offset.";
      body.appendChild(state);

      const arm = document.createElement("button");
      arm.textContent = observing ? "Apply the correction" : "Observe only";
      arm.onclick = () => post("overshoot/observe",
        { climate_entity: climate.climate_entity, observe_only: !observing }, arm);
      body.appendChild(arm);

      const reset = document.createElement("button");
      reset.textContent = "Reset learning";
      reset.onclick = () => post("overshoot/reset",
        { climate_entity: climate.climate_entity }, reset);
      body.appendChild(reset);
      details.appendChild(body);

      // Loaded on open rather than with the list: 50 rows per climate is a lot
      // to carry for a panel that is usually closed.
      details.ontoggle = () => {
        if (!details.open || details.dataset.loaded) return;
        details.dataset.loaded = "1";
        loadJournal(climate.climate_entity, details);
      };
      return details;
    }

    async function loadJournal(entity, details) {
      const placeholder = document.createElement("div");
      placeholder.className = "empty-journal";
      placeholder.textContent = "Loading episodes…";
      details.appendChild(placeholder);

      const response = await fetch(apiURL("overshoot?climate=" + encodeURIComponent(entity)));
      if (!response.ok) {
        placeholder.textContent = "Could not read the journal.";
        return;
      }
      const report = await response.json();
      const rows = Array.isArray(report.journal) ? report.journal : [];
      if (rows.length === 0) {
        // A learner with no episodes at all looks exactly like a converged one,
        // so say which it is rather than showing an empty table.
        placeholder.textContent = "No episodes recorded yet. Nothing has been learned " +
          "and no correction is being applied.";
        return;
      }
      placeholder.remove();
      const scroller = document.createElement("div");
      scroller.className = "journal-scroll";
      scroller.appendChild(journalTable(rows));
      details.appendChild(scroller);
    }

    function journalTable(rows) {
      const table = document.createElement("table");
      table.className = "journal";
      const head = document.createElement("tr");
      // Outside and Rad. are recorded, not acted on: they are the columns that
      // will eventually say whether one k per climate is enough, or whether the
      // coefficient has to vary with the weather and the radiator.
      for (const label of ["Opened", "Request", "Rise", "Commanded", "Peak", "Error",
        "Outside", "Rad. cut", "Cool t½", "k", "Outcome"]) {
        const cell = document.createElement("th");
        cell.textContent = label;
        head.appendChild(cell);
      }
      table.appendChild(head);

      // Newest first: the question is almost always "what did it do last night".
      for (const row of rows.slice().reverse()) {
        const tr = document.createElement("tr");
        const discarded = row.outcome === "discarded";
        if (discarded) tr.className = "discarded";
        const error = Number(row.error);
        const cells = [
          clock(row.opened_at),
          temp(row.requested),
          temp(row.rise),
          temp(row.commanded),
          discarded ? "—" : temp(row.peak),
          discarded ? "—" : signed(error),
          temp(row.outdoor_at_open),
          // The radiator at the cutoff: the stored energy about to land in the
          // room, which is what the overshoot actually is.
          temp(row.radiator_at_cutoff),
          // How long the radiator took to give up half its lead over the room.
          // A value that suddenly shortens means the plant changed — air in the
          // radiator, a valve that stopped closing — which no peak shows.
          minutes(row.decay_half_life),
          round(row.k_before, 3) + " → " + round(row.k_after, 3),
          discarded ? "discarded: " + (row.reason || "?") : row.outcome,
        ];
        cells.forEach((text, index) => {
          const cell = document.createElement("td");
          cell.textContent = text;
          // The one number the whole feature exists to shrink.
          if (index === 5 && !discarded && error > 0.3) cell.className = "err-hot";
          tr.appendChild(cell);
        });
        table.appendChild(tr);
      }
      return table;
    }

    const round = (value, places) => {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      const factor = Math.pow(10, places);
      return String(Math.round(number * factor) / factor);
    };
    const temp = (value) => (Number.isFinite(Number(value)) ? round(value, 2) + "°" : "—");
    const minutes = (seconds) => (Number.isFinite(Number(seconds))
      ? round(Number(seconds) / 60, 1) + "m" : "—");
    const signed = (value) => (Number.isFinite(value)
      ? (value > 0 ? "+" : "") + round(value, 2) + "°" : "—");
    // Epoch seconds, as lib/overshoot.lua records them. No year and no seconds:
    // a 50-row ring never spans one, and the full locale string is wide enough
    // to crowd out the numbers the table exists for.
    const clock = (epoch) => (Number.isFinite(Number(epoch))
      ? new Date(Number(epoch) * 1000).toLocaleString(undefined,
        { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : "—");

    async function post(path, body, button) {
      button.disabled = true;
      await fetch(apiURL(path), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      load();
    }

    async function remove(entity, button) {
      button.disabled = true;
      await fetch(apiURL("remove"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ climate_entity: entity }),
      });
      load();
    }

    load();
  </script>
</body>

</html>
